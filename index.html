<html lang="en">
<head>

<meta name="description" content="Krzysztof (Chris) Czarski: private English lessons and Erasmus+ workshops.">
<link rel="stylesheet" href="assets/style.css">
<script>
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(!t){try{t=matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':''}catch(e){}}if(t==='dark')document.documentElement.setAttribute('data-theme','dark')})();
</script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html">Krzysztof Czarski</a>
      <nav class="topnav">
        <a class="xlink" href="blog.html">Blog</a>
        <a class="xlink lang" href="pl/index.html">PL</a>
        <button type="button" class="theme" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg></button>
      </nav>
    </header>
    <main>
<ul class="chooser">
        <li><a href="lessons.html">
          <span>I want to speak English <mark class="hl">more fluently</mark></span>
          <span class="arrow">→</span>
        </a></li>
        <li><a href="workshops.html">
          <span>I&rsquo;m looking for a <mark class="hl">passionate</mark> and experienced workshop facilitator</span>
          <span class="arrow">→</span>
        </a></li>
      </ul>
    </main>
<script>
document.getElementById('theme').addEventListener('click',function(){var h=document.documentElement;h.hasAttribute('data-theme')?h.removeAttribute('data-theme'):h.setAttribute('data-theme','dark');try{localStorage.setItem('theme',h.hasAttribute('data-theme')?'dark':'')}catch(e){}});
</script>
  </div>
</body>
</html>
