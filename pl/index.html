<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krzysztof Czarski</title>
<meta name="description" content="Krzysztof (Chris) Czarski: prywatne lekcje angielskiego i warsztaty Erasmus+.">
<link rel="stylesheet" href="../assets/style.css">
<script>
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t==='dark')document.documentElement.setAttribute('data-theme','dark');else if(t==='light'){}else{try{matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.setAttribute('data-theme','dark')}catch(e){}}})();
</script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html">Krzysztof Czarski</a>
      <nav class="topnav">
        <a class="xlink lang" href="../index.html">EN</a>
        <button type="button" class="theme" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg></button>
      </nav>
    </header>
    <main>
<ul class="chooser">
        <li><a href="lessons.html">
          <span>Chcę mówić po angielsku <mark class="hl">płynniej</mark></span>
          <span class="arrow">→</span>
        </a></li>
        <li><a href="workshops.html">
          <span>Szukam prowadzącego warsztaty z <mark class="hl">pasją</mark> i doświadczeniem</span>
          <span class="arrow">→</span>
        </a></li>
      </ul>
    </main>
<script>
document.getElementById('theme').addEventListener('click',function(){var h=document.documentElement;h.hasAttribute('data-theme')?h.removeAttribute('data-theme'):h.setAttribute('data-theme','dark');try{localStorage.setItem('theme',h.hasAttribute('data-theme')?'dark':'light')}catch(e){}});
</script>
  </div>
</body>
</html>
